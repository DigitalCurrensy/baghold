[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baghold"
version = "0.1.0"
description = "Score a pit mouth from the numbers the caller supplies."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Digital Currensy Inc." }]

[tool.setuptools.packages.find]
where = ["src"]
